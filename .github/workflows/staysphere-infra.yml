name: StaySphere infrastructure

on:
  workflow_dispatch:
  pull_request:
    paths: ['StaySphere/infrastructure/bicep/**', '.github/workflows/staysphere-infra.yml']
  push:
    branches: [main]
    paths: ['StaySphere/infrastructure/bicep/**', '.github/workflows/staysphere-infra.yml']

jobs:
  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Bicep
        run: |
          mkdir -p "$HOME/.bicep"
          curl -sSL -o "$HOME/.bicep/bicep" https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x "$HOME/.bicep/bicep"
          echo "$HOME/.bicep" >> "$GITHUB_PATH"
      - name: Build + lint
        working-directory: StaySphere/infrastructure/bicep
        run: |
          bicep build main.bicep --stdout > /dev/null
          bicep lint main.bicep
          for f in env/*.bicepparam; do bicep build-params "$f" --stdout > /dev/null; done

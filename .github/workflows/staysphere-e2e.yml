name: StaySphere e2e

on:
  workflow_dispatch:
  schedule: [{ cron: '0 3 * * *' }]
  pull_request:
    paths: ['StaySphere/**']

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Start full stack (docker compose)
        working-directory: StaySphere
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do curl -sf http://localhost:5173/api/v1/features && break; sleep 5; done
          sleep 15
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: StaySphere/web/staysphere-web/package-lock.json }
      - name: Playwright
        working-directory: StaySphere/web/staysphere-web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - if: failure()
        working-directory: StaySphere
        run: docker compose logs api > api.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: e2e-report, path: "StaySphere/web/staysphere-web/playwright-report\nStaySphere/api.log" }

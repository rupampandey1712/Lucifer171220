name: StaySphere e2e

on:
  workflow_dispatch:
  schedule: [{ cron: '0 3 * * *' }]
  pull_request:
    paths: ['StaySphere/**']

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Start full stack (docker compose)
        working-directory: StaySphere
        run: |
          docker compose up -d --build
          # Wait for the API (through the web container's proxy); fail with logs instead of testing a dead stack.
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5173/api/v1/features; then echo; echo "API ready"; exit 0; fi
            sleep 5
          done
          echo "::error::API did not become ready within 5 minutes"
          docker compose ps
          docker compose logs --tail 300 api
          exit 1
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: StaySphere/web/staysphere-web/package-lock.json }
      - name: Playwright
        working-directory: StaySphere/web/staysphere-web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - if: failure()
        working-directory: StaySphere
        run: |
          docker compose ps
          docker compose logs api > api.log
          tail -n 150 api.log
          # Playwright's page snapshot at the moment of each failure (readable without downloading the artifact)
          for f in web/staysphere-web/test-results/*/error-context.md; do [ -f "$f" ] && { echo "=== $f"; head -n 80 "$f"; }; done
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: e2e-report, path: "StaySphere/web/staysphere-web/playwright-report\nStaySphere/api.log" }

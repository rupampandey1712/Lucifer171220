name: StaySphere quality (k6 load + OWASP ZAP)

# Heavier, slower checks that don't belong on every push: weekly, on demand, and on PRs that change the edge (nginx, API pipeline).
on:
  workflow_dispatch:
    inputs:
      vus: { description: 'k6 virtual users', default: '20' }
      duration: { description: 'k6 steady-state duration', default: '1m' }
  schedule: [{ cron: '0 4 * * 1' }]
  pull_request:
    paths: ['StaySphere/web/staysphere-web/nginx.conf', 'StaySphere/src/StaySphere.Api/Program.cs', 'StaySphere/tests/perf/**', 'StaySphere/tests/security/**']

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: StaySphere } }
    steps:
      - uses: actions/checkout@v5
      - name: Start stack (perf profile)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.perf.yml up -d --build
          for i in $(seq 1 60); do curl -sf http://localhost:5173/api/v1/features && exit 0; sleep 5; done
          docker compose logs --tail 200 api; exit 1
      - name: k6 browse journey (fails if SLO thresholds are missed)
        run: |
          docker run --rm --network host -v "$PWD/tests/perf:/perf" \
            -e BASE_URL=http://localhost:5173 -e VUS=${{ inputs.vus || '20' }} -e DURATION=${{ inputs.duration || '1m' }} \
            grafana/k6:0.57.0 run --summary-export /perf/summary.json /perf/browse.js
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: k6-summary, path: StaySphere/tests/perf/summary.json, if-no-files-found: ignore }

  zap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Start stack
        working-directory: StaySphere
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do curl -sf http://localhost:5173/api/v1/features && exit 0; sleep 5; done
          docker compose logs --tail 200 api; exit 1
      - name: OWASP ZAP baseline (passive scan of the SPA and API through nginx)
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:5173
          rules_file_name: StaySphere/tests/security/zap-rules.tsv
          # -I: warnings are reported, only rules marked FAIL in the rules file break the build. -j: also run the AJAX spider for the SPA.
          cmd_options: '-I -j'
          allow_issue_writing: false
          artifact_name: zap-report

# Serves the SPA and reverse-proxies the API + SignalR hub (same origin → HttpOnly SameSite=Strict cookies work).

# Crawlers and link-preview bots get server-rendered listing pages (title, description, OpenGraph, JSON-LD, content);
# people get the SPA. Same URL, same content, so this is dynamic rendering rather than cloaking.
map $http_user_agent $is_bot {
  default 0;
  ~*(googlebot|bingbot|duckduckbot|yandex|baiduspider|applebot|slurp|facebookexternalhit|facebot|twitterbot|linkedinbot|slackbot|discordbot|whatsapp|telegrambot|pinterest|embedly|redditbot|skypeuripreview) 1;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 12m;
  server_tokens off;

  include /etc/nginx/snippets/security-headers.conf;

  location /api/ { proxy_pass http://api:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 120s; }
  location /hubs/ { proxy_pass http://api:8080; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_read_timeout 3600s; }
  location /media/ { proxy_pass http://api:8080; }
  location /swagger { proxy_pass http://api:8080; }
  location /openapi/ { proxy_pass http://api:8080; }
  location = /robots.txt { proxy_pass http://api:8080; }
  location = /sitemap.xml { proxy_pass http://api:8080; }
  # Only reachable through the bot rewrite below.
  location /seo/ { internal; proxy_pass http://api:8080; proxy_set_header Host $host; }

  location ~ "^/property/([0-9a-fA-F-]{36})/?$" {
    if ($is_bot) { rewrite "^/property/([0-9a-fA-F-]{36})/?$" /seo/property/$1 last; }
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    add_header Vary "User-Agent";
    try_files /index.html =404;
  }
  location /assets/ { expires 1y; include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location / { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-cache"; try_files $uri /index.html; }
}
